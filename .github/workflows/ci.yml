name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Integration tests create and drop their own databases on this server.
      AGENTIC_TEST_DATABASE_URL: postgres://agentic:agentic@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race ./...
